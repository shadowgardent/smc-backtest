<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSwing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F7FF"/>
    </linearGradient>
    <linearGradient id="titleSwing" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <rect width="680" height="440" rx="16" fill="url(#bgSwing)" stroke="#93C5FD" stroke-width="2"/>

  <!-- Header -->
  <rect x="16" y="14" width="648" height="42" rx="10" fill="url(#titleSwing)"/>
  <text x="32" y="40" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">
    SWING HIGH &amp; SWING LOW — Sliding Window Extremum (2N + 1 Bars)
  </text>

  <!-- Grid Lines -->
  <g stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4,4">
    <line x1="30" y1="110" x2="650" y2="110"/>
    <line x1="30" y1="180" x2="650" y2="180"/>
    <line x1="30" y1="250" x2="650" y2="250"/>
    <line x1="30" y1="320" x2="650" y2="320"/>
  </g>

  <!-- LEFT WINDOW HIGHLIGHT: SWING HIGH (2N+1) -->
  <rect x="52" y="72" width="276" height="215" rx="12" fill="#EFF6FF" fill-opacity="0.75" stroke="#3B82F6" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="190" y="92" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#1D4ED8">
    Window [i - N ... i ... i + N]
  </text>

  <!-- Swing High Point Indicator -->
  <circle cx="190" cy="112" r="7" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/>
  <rect x="125" y="62" width="130" height="24" rx="12" fill="#1E3A8A"/>
  <text x="190" y="78" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#FFFFFF">
    Swing High (idx = i)
  </text>

  <!-- Candles for Swing High (Left N=2, Center=1, Right N=2 schematic) -->
  <!-- i-2 -->
  <line x1="90" y1="175" x2="90" y2="245" stroke="#2563EB" stroke-width="2.5"/>
  <rect x="81" y="190" width="18" height="40" rx="3" fill="#3B82F6"/>
  <text x="90" y="268" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#475569">i-2</text>

  <!-- i-1 -->
  <line x1="140" y1="145" x2="140" y2="215" stroke="#2563EB" stroke-width="2.5"/>
  <rect x="131" y="155" width="18" height="42" rx="3" fill="#2563EB"/>
  <text x="140" y="268" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#475569">i-1</text>

  <!-- i (PEAK) -->
  <line x1="190" y1="112" x2="190" y2="195" stroke="#0F172A" stroke-width="3"/>
  <rect x="180" y="130" width="20" height="48" rx="3" fill="#1E3A8A" stroke="#2563EB" stroke-width="1.5"/>
  <text x="190" y="268" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#1E3A8A">i</text>

  <!-- i+1 -->
  <line x1="240" y1="148" x2="240" y2="220" stroke="#64748B" stroke-width="2.5"/>
  <rect x="231" y="162" width="18" height="42" rx="3" fill="#93C5FD" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="240" y="268" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#475569">i+1</text>

  <!-- i+2 -->
  <line x1="290" y1="178" x2="290" y2="250" stroke="#64748B" stroke-width="2.5"/>
  <rect x="281" y="192" width="18" height="42" rx="3" fill="#93C5FD" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="290" y="268" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#475569">i+2</text>


  <!-- RIGHT WINDOW HIGHLIGHT: SWING LOW (2N+1) -->
  <rect x="352" y="135" width="276" height="215" rx="12" fill="#EFF6FF" fill-opacity="0.75" stroke="#1E3A8A" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="490" y="155" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#0F172A">
    Window [j - N ... j ... j + N]
  </text>

  <!-- Candles for Swing Low -->
  <!-- j-2 -->
  <line x1="390" y1="185" x2="390" y2="265" stroke="#64748B" stroke-width="2.5"/>
  <rect x="381" y="200" width="18" height="44" rx="3" fill="#93C5FD" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="390" y="177" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#475569">j-2</text>

  <!-- j-1 -->
  <line x1="440" y1="215" x2="440" y2="295" stroke="#64748B" stroke-width="2.5"/>
  <rect x="431" y="232" width="18" height="44" rx="3" fill="#93C5FD" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="440" y="177" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#475569">j-1</text>

  <!-- j (VALLEY) -->
  <line x1="490" y1="240" x2="490" y2="328" stroke="#0F172A" stroke-width="3"/>
  <rect x="480" y="255" width="20" height="48" rx="3" fill="#0F172A" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="490" y="177" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#0F172A">j</text>

  <!-- j+1 -->
  <line x1="540" y1="212" x2="540" y2="292" stroke="#2563EB" stroke-width="2.5"/>
  <rect x="531" y="228" width="18" height="45" rx="3" fill="#2563EB"/>
  <text x="540" y="177" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#475569">j+1</text>

  <!-- j+2 -->
  <line x1="590" y1="180" x2="590" y2="260" stroke="#2563EB" stroke-width="2.5"/>
  <rect x="581" y="195" width="18" height="45" rx="3" fill="#3B82F6"/>
  <text x="590" y="177" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#475569">j+2</text>

  <!-- Swing Low Point Indicator -->
  <circle cx="490" cy="328" r="7" fill="#0F172A" stroke="#FFFFFF" stroke-width="2"/>
  <rect x="425" y="340" width="130" height="24" rx="12" fill="#2563EB"/>
  <text x="490" y="356" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#FFFFFF">
    Swing Low (idx = j)
  </text>

  <!-- Bottom Mathematical Rule Box -->
  <rect x="24" y="374" width="632" height="52" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.8"/>
  <text x="40" y="396" font-family="Consolas, monospace" font-size="12.5" font-weight="700" fill="#1E3A8A">
    • Swing High Condition : High[i] == max(High[i - n : i + n + 1])
  </text>
  <text x="40" y="416" font-family="Consolas, monospace" font-size="12.5" font-weight="700" fill="#0F172A">
    • Swing Low Condition  : Low[j]  == min(Low[j - n : j + n + 1])   (Default n = 5 bars)
  </text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFvg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F7FF"/>
    </linearGradient>
    <linearGradient id="titleFvg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="fvgGapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#93C5FD" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <rect width="680" height="440" rx="16" fill="url(#bgFvg)" stroke="#93C5FD" stroke-width="2"/>

  <!-- Header -->
  <rect x="16" y="14" width="648" height="42" rx="10" fill="url(#titleFvg)"/>
  <text x="32" y="40" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">
    FAIR VALUE GAP (FVG) — 3-Candle Price Imbalance &amp; Displacement Filter
  </text>

  <!-- FVG Shaded Box Between High[i-2] (y=245) and Low[i] (y=165) -->
  <rect x="115" y="165" width="490" height="80" rx="6" fill="url(#fvgGapGrad)" stroke="#2563EB" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Top Boundary Label: Low[i] -->
  <line x1="95" y1="165" x2="615" y2="165" stroke="#1E3A8A" stroke-width="2"/>
  <rect x="335" y="141" width="255" height="22" rx="6" fill="#1E3A8A"/>
  <text x="462" y="156" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#FFFFFF">
    top = Low[i] (ขอบบนของ Bullish FVG)
  </text>

  <!-- Bottom Boundary Label: High[i-2] -->
  <line x1="95" y1="245" x2="615" y2="245" stroke="#1E3A8A" stroke-width="2"/>
  <rect x="335" y="247" width="265" height="22" rx="6" fill="#2563EB"/>
  <text x="467" y="262" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#FFFFFF">
    bottom = High[i-2] (ขอบล่างของ FVG)
  </text>

  <!-- Center FVG Description -->
  <text x="445" y="198" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0F172A">
    BULLISH FAIR VALUE GAP (Imbalance Void)
  </text>
  <text x="445" y="218" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#1D4ED8">
    gap_up = Low[i] - High[i-2] &gt; 0
  </text>

  <!-- CANDLE 1: idx = i - 2 -->
  <line x1="115" y1="245" x2="115" y2="335" stroke="#0F172A" stroke-width="3"/>
  <rect x="99" y="268" width="32" height="52" rx="4" fill="#3B82F6" stroke="#1E3A8A" stroke-width="1.5"/>
  <circle cx="115" cy="245" r="6" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/>
  <text x="115" y="355" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#0F172A">
    Candle 1 (i-2)
  </text>

  <!-- CANDLE 2: idx = i - 1 (DISPLACEMENT IMPULSE CANDLE) -->
  <line x1="210" y1="115" x2="210" y2="295" stroke="#0F172A" stroke-width="3.5"/>
  <rect x="192" y="130" width="36" height="150" rx="5" fill="#1E3A8A" stroke="#2563EB" stroke-width="2"/>
  <text x="210" y="355" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#1E3A8A">
    Candle 2 (i-1)
  </text>
  <rect x="148" y="76" width="142" height="24" rx="6" fill="#0F172A"/>
  <text x="219" y="92" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#FFFFFF">
    Impulse &gt; 2×Mean
  </text>

  <!-- CANDLE 3: idx = i -->
  <line x1="305" y1="80" x2="305" y2="165" stroke="#0F172A" stroke-width="3"/>
  <rect x="289" y="95" width="32" height="52" rx="4" fill="#2563EB" stroke="#0F172A" stroke-width="1.5"/>
  <circle cx="305" cy="165" r="6" fill="#1E3A8A" stroke="#FFFFFF" stroke-width="2"/>
  <text x="305" y="355" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#0F172A">
    Candle 3 (i)
  </text>

  <!-- Future Candle Mitigating FVG (idx = k) -->
  <line x1="575" y1="130" x2="575" y2="252" stroke="#0F172A" stroke-width="2.5"/>
  <rect x="563" y="145" width="24" height="92" rx="3" fill="#93C5FD" stroke="#1E3A8A" stroke-width="1.5"/>
  <circle cx="575" cy="245" r="6" fill="#0F172A" stroke="#FFFFFF" stroke-width="2"/>
  <text x="575" y="355" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#1D4ED8">
    Mitigated (Low[k] &lt;= bottom)
  </text>

  <!-- Bottom Formula & Filter Card -->
  <rect x="24" y="368" width="632" height="58" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.8"/>
  <text x="40" y="390" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#0F172A">
    • Bullish FVG: Low[i] - High[i-2] &gt; 0   |   Bearish FVG: Low[i-2] - High[i] &gt; 0
  </text>
  <text x="40" y="412" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#2563EB">
    • Auto Displacement Filter: bar_deltas[i-1] &gt; 2 × cum_mean[i]  (Vectorized np.cumsum)
  </text>
</svg>

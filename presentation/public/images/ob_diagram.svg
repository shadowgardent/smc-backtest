<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bgOb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F7FF"/>
    </linearGradient>
    <linearGradient id="titleOb" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="obZoneGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <rect width="680" height="440" rx="16" fill="url(#bgOb)" stroke="#93C5FD" stroke-width="2"/>

  <!-- Header -->
  <rect x="16" y="14" width="648" height="42" rx="10" fill="url(#titleOb)"/>
  <text x="32" y="40" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">
    ORDER BLOCK (OB) — Origin Candle Detection, ATR Filter &amp; Mitigation
  </text>

  <!-- Previous Swing High Line (BOS Level) -->
  <line x1="45" y1="150" x2="365" y2="150" stroke="#1E3A8A" stroke-width="2" stroke-dasharray="6,4"/>
  <rect x="55" y="122" width="165" height="24" rx="6" fill="#1E3A8A"/>
  <text x="137" y="138" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#FFFFFF">
    Swing High (BOS Level)
  </text>

  <!-- ORDER BLOCK ZONE BOX (Extended across chart) -->
  <rect x="148" y="258" width="465" height="52" rx="4" fill="url(#obZoneGrad)" stroke="#2563EB" stroke-width="2"/>
  <text x="375" y="280" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#1E3A8A">
    BULLISH ORDER BLOCK ZONE  [ top = max(O,C) | bottom = min(O,C) ]
  </text>
  <text x="375" y="299" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#1D4ED8">
    Filter: (High[j] - Low[j]) &lt; 2 × ATR[j]  •  Backward Scan: max 50 bars
  </text>

  <!-- Candles Before OB -->
  <line x1="75" y1="150" x2="75" y2="225" stroke="#1E3A8A" stroke-width="2.5"/>
  <rect x="66" y="165" width="18" height="42" rx="3" fill="#2563EB"/>

  <line x1="115" y1="190" x2="115" y2="265" stroke="#64748B" stroke-width="2.5"/>
  <rect x="106" y="205" width="18" height="45" rx="3" fill="#93C5FD" stroke="#1E3A8A" stroke-width="1.5"/>

  <!-- ORIGIN CANDLE (j) - Last Bearish Candle before Impulse -->
  <line x1="160" y1="246" x2="160" y2="322" stroke="#0F172A" stroke-width="3"/>
  <rect x="148" y="258" width="24" height="52" rx="3" fill="#0F172A" stroke="#2563EB" stroke-width="2"/>
  <rect x="85" y="328" width="155" height="26" rx="8" fill="#0F172A"/>
  <text x="162" y="345" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#FFFFFF">
    Origin Candle (idx = j)
  </text>

  <!-- Impulse Bullish Candles Breaking Structure -->
  <line x1="210" y1="195" x2="210" y2="275" stroke="#2563EB" stroke-width="2.5"/>
  <rect x="200" y="205" width="20" height="58" rx="3" fill="#3B82F6"/>

  <line x1="260" y1="155" x2="260" y2="220" stroke="#2563EB" stroke-width="2.5"/>
  <rect x="250" y="162" width="20" height="48" rx="3" fill="#2563EB"/>

  <!-- Breakout Candle (idx = event_pos) -->
  <line x1="310" y1="95" x2="310" y2="175" stroke="#1E3A8A" stroke-width="3"/>
  <rect x="299" y="105" width="22" height="62" rx="3" fill="#1E3A8A"/>
  <rect x="242" y="66" width="142" height="24" rx="8" fill="#2563EB"/>
  <text x="313" y="82" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#FFFFFF">
    BOS Break (event_pos)
  </text>

  <!-- Arrow showing Backward Scan from event_pos to j -->
  <path d="M 295 135 C 240 135, 190 185, 168 242" fill="none" stroke="#1D4ED8" stroke-width="2.2" stroke-dasharray="4,3"/>
  <text x="218" y="172" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#1D4ED8">Scan back j ←</text>

  <!-- Pullback Candles Returning to Mitigate OB -->
  <line x1="415" y1="115" x2="415" y2="190" stroke="#64748B" stroke-width="2.5"/>
  <rect x="406" y="128" width="18" height="48" rx="3" fill="#93C5FD" stroke="#1E3A8A" stroke-width="1.5"/>

  <line x1="470" y1="168" x2="470" y2="240" stroke="#64748B" stroke-width="2.5"/>
  <rect x="461" y="178" width="18" height="50" rx="3" fill="#93C5FD" stroke="#1E3A8A" stroke-width="1.5"/>

  <!-- Mitigation Touch Candle (idx = k) -->
  <line x1="530" y1="215" x2="530" y2="278" stroke="#0F172A" stroke-width="3"/>
  <rect x="520" y="222" width="20" height="36" rx="3" fill="#2563EB"/>
  <circle cx="530" cy="265" r="7" fill="#1E3A8A" stroke="#FFFFFF" stroke-width="2"/>
  <rect x="468" y="322" width="168" height="26" rx="8" fill="#1D4ED8"/>
  <text x="552" y="339" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#FFFFFF">
    Mitigated (Low[k] &lt;= top)
  </text>

  <!-- Bounce Up After OB Touch -->
  <line x1="585" y1="135" x2="585" y2="230" stroke="#1E3A8A" stroke-width="3"/>
  <rect x="575" y="145" width="20" height="75" rx="3" fill="#1E3A8A"/>

  <!-- Bottom Explanation Box -->
  <rect x="24" y="364" width="632" height="62" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.8"/>
  <text x="40" y="386" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#0F172A">
    ขั้นตอนอัลกอริทึม detect_order_blocks():
  </text>
  <text x="40" y="404" font-family="Consolas, monospace" font-size="11.5" fill="#1E3A8A">
    1) เมื่อเกิด BOS/CHoCH ที่ event_pos ให้วนลูปย้อนกลับ j = event_pos-1 ถอยหลังสูงสุด 50 แท่ง
  </text>
  <text x="40" y="420" font-family="Consolas, monospace" font-size="11.5" fill="#1E3A8A">
    2) ข้ามแท่งที่ (High-Low) &gt;= 2*ATR  3) เก็บแท่งสีตรงข้ามแรก และเช็คการถูกแตะโซน (Mitigation)
  </text>
</svg>

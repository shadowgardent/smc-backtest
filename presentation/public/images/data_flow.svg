<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F7FF"/>
    </linearGradient>
    <linearGradient id="headerBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="cardBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="softBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1E3A8A" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1E3A8A"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="540" rx="18" fill="url(#bgGrad)" stroke="#BFDBFE" stroke-width="2"/>

  <!-- Top Header Banner -->
  <rect x="24" y="20" width="1052" height="54" rx="12" fill="url(#headerBlue)"/>
  <text x="48" y="53" font-family="Segoe UI, Inter, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">
    SYSTEM DATA FLOW ARCHITECTURE — โครงสร้างการไหลของข้อมูลระบบวิเคราะห์ SMC
  </text>
  <rect x="860" y="31" width="196" height="32" rx="16" fill="#3B82F6" stroke="#93C5FD" stroke-width="1"/>
  <text x="958" y="52" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#FFFFFF">
    END-TO-END PIPELINE
  </text>

  <!-- COLUMN 1: USER & MT5 INPUT -->
  <g filter="url(#shadow)">
    <rect x="30" y="96" width="215" height="190" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <rect x="30" y="96" width="215" height="38" rx="14" fill="url(#cardBlue)"/>
    <text x="137" y="120" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">
      1. USER INPUT (FRONTEND)
    </text>
    <text x="48" y="156" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0F172A">• เลือก Symbol &amp; Timeframe</text>
    <text x="58" y="176" font-family="Consolas, monospace" font-size="12" fill="#1D4ED8">XAUUSD, EURUSD (M5–W1)</text>
    <text x="48" y="204" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0F172A">• กำหนดพารามิเตอร์ Backtest</text>
    <text x="58" y="224" font-family="Consolas, monospace" font-size="12" fill="#1D4ED8">Balance, Risk%, RR Ratio</text>
    <rect x="46" y="240" width="183" height="30" rx="8" fill="#EFF6FF" stroke="#93C5FD"/>
    <text x="137" y="260" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#1E40AF">
      GET /api/chart &amp; /dashboard
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect x="30" y="314" width="215" height="196" rx="14" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="2"/>
    <rect x="30" y="314" width="215" height="38" rx="14" fill="#0F172A"/>
    <text x="137" y="338" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">
      2. MARKET DATA (MT5 API)
    </text>
    <text x="48" y="376" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0F172A">• MetaTrader 5 Terminal</text>
    <text x="58" y="396" font-family="Consolas, monospace" font-size="12" fill="#334155">mt5.copy_rates_from_pos()</text>
    <text x="48" y="424" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0F172A">• ข้อมูลแท่งเทียน OHLCV</text>
    <text x="58" y="444" font-family="Consolas, monospace" font-size="12" fill="#334155">Open, High, Low, Close, Time</text>
    <rect x="46" y="462" width="183" height="32" rx="8" fill="#DBEAFE" stroke="#60A5FA"/>
    <text x="137" y="483" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#1E3A8A">
      Pandas DataFrame / NumPy
    </text>
  </g>

  <!-- Arrow between User Input & MT5 Service -->
  <line x1="137" y1="286" x2="137" y2="310" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrowBlue)"/>

  <!-- Arrow from MT5 to SMC Engine -->
  <path d="M 245 412 L 278 412 L 278 300 L 304 300" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <path d="M 245 190 L 278 190 L 278 260 L 304 260" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrowBlue)"/>

  <!-- COLUMN 2: CORE SMC ENGINE (CENTER CONTAINER) -->
  <g filter="url(#shadow)">
    <rect x="310" y="96" width="465" height="414" rx="16" fill="#F8FAFC" stroke="#1D4ED8" stroke-width="2.5"/>
    <rect x="310" y="96" width="465" height="42" rx="16" fill="url(#cardBlue)"/>
    <text x="542" y="123" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">
      3. FASTAPI BACKEND &amp; SMC CALCULATION ENGINE (Python)
    </text>

    <!-- Step 3.1 -->
    <rect x="332" y="152" width="420" height="54" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="342" y="162" width="34" height="34" rx="8" fill="#1E3A8A"/>
    <text x="359" y="184" text-anchor="middle" font-family="Consolas, monospace" font-size="15" font-weight="700" fill="#FFFFFF">3.1</text>
    <text x="388" y="175" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Volatility &amp; Swing Detection (calc_atr + detect_swings)</text>
    <text x="388" y="195" font-family="Consolas, monospace" font-size="12" fill="#2563EB">Wilder's ATR(14) + Sliding Window (2N+1) หาจุด Swing High / Low</text>

    <line x1="542" y1="206" x2="542" y2="220" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowBlue)"/>

    <!-- Step 3.2 -->
    <rect x="332" y="222" width="420" height="54" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="342" y="232" width="34" height="34" rx="8" fill="#1D4ED8"/>
    <text x="359" y="254" text-anchor="middle" font-family="Consolas, monospace" font-size="15" font-weight="700" fill="#FFFFFF">3.2</text>
    <text x="388" y="245" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Market Structure FSM (detect_structure)</text>
    <text x="388" y="265" font-family="Consolas, monospace" font-size="12" fill="#2563EB">Finite State Machine แยกแยะ BOS (ไปต่อ) และ CHoCH (กลับตัว)</text>

    <line x1="542" y1="276" x2="542" y2="290" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowBlue)"/>

    <!-- Step 3.3 -->
    <rect x="332" y="292" width="420" height="54" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="342" y="302" width="34" height="34" rx="8" fill="#2563EB"/>
    <text x="359" y="324" text-anchor="middle" font-family="Consolas, monospace" font-size="15" font-weight="700" fill="#FFFFFF">3.3</text>
    <text x="388" y="315" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Institutional Zones (detect_order_blocks + detect_fvg)</text>
    <text x="388" y="335" font-family="Consolas, monospace" font-size="12" fill="#2563EB">ค้นหา Origin OB (&lt; 2*ATR), ช่องว่าง FVG (&gt; 2*Mean) &amp; Mitigation</text>

    <line x1="542" y1="346" x2="542" y2="360" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowBlue)"/>

    <!-- Step 3.4 -->
    <rect x="332" y="362" width="420" height="54" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="342" y="372" width="34" height="34" rx="8" fill="#3B82F6"/>
    <text x="359" y="394" text-anchor="middle" font-family="Consolas, monospace" font-size="15" font-weight="700" fill="#FFFFFF">3.4</text>
    <text x="388" y="385" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Liquidity &amp; Price Zones (EQH/EQL + Premium/Discount)</text>
    <text x="388" y="405" font-family="Consolas, monospace" font-size="12" fill="#2563EB">ตรวจจับเป้าสภาพคล่อง (&lt; 0.1*ATR) และแบ่งโซนถูก/แพงตามช่วงราคา</text>

    <line x1="542" y1="416" x2="542" y2="430" stroke="#2563EB" stroke-width="2" marker-end="url(#arrowBlue)"/>

    <!-- Step 3.5 -->
    <rect x="332" y="432" width="420" height="62" rx="10" fill="url(#softBlue)" stroke="#2563EB" stroke-width="2"/>
    <rect x="342" y="445" width="34" height="34" rx="8" fill="#0F172A"/>
    <text x="359" y="467" text-anchor="middle" font-family="Consolas, monospace" font-size="15" font-weight="700" fill="#FFFFFF">3.5</text>
    <text x="388" y="456" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Multi-Timeframe Scoring (7 TFs) &amp; Backtest Engine</text>
    <text x="388" y="478" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#1E3A8A">รวมคะแนน W1(3)+D1(3)+H4(2)+H1(2)+M30(1)+M15(1)+M5(1) = ±13</text>
  </g>

  <!-- Arrows from Engine to Output -->
  <line x1="775" y1="210" x2="824" y2="210" stroke="#2563EB" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <line x1="775" y1="410" x2="824" y2="410" stroke="#1E3A8A" stroke-width="3" marker-end="url(#arrowDark)"/>

  <!-- COLUMN 3: OUTPUT VISUALIZATION & DASHBOARD -->
  <g filter="url(#shadow)">
    <rect x="830" y="96" width="242" height="202" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <rect x="830" y="96" width="242" height="38" rx="14" fill="url(#cardBlue)"/>
    <text x="951" y="120" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">
      4. INTERACTIVE CHART UI
    </text>
    <text x="846" y="156" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0F172A">• TradingView Lightweight</text>
    <text x="856" y="175" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">แสดงกราฟแท่งเทียนความเร็วสูง</text>
    <text x="846" y="200" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0F172A">• HTML5 Canvas Overlay</text>
    <text x="856" y="219" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">วาดกล่อง OB, FVG, เส้น BOS/CHoCH</text>
    <text x="846" y="244" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0F172A">• Layer Toggle Filters</text>
    <rect x="846" y="256" width="210" height="28" rx="6" fill="#EFF6FF" stroke="#93C5FD"/>
    <text x="951" y="275" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#1D4ED8">
      Active vs Mitigated Zones
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect x="830" y="314" width="242" height="196" rx="14" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
    <rect x="830" y="314" width="242" height="38" rx="14" fill="#0F172A"/>
    <text x="951" y="338" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">
      5. DASHBOARD &amp; BACKTEST
    </text>
    <text x="846" y="374" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0F172A">• Multi-TF Signal Card</text>
    <text x="856" y="393" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#2563EB">Strong BUY / SELL / WAIT</text>
    <text x="846" y="418" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#0F172A">• H4 SMC Setup Radar</text>
    <text x="856" y="437" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">แจ้งเตือนเมื่อราคาเข้าโซน H4 OB/FVG</text>
    <rect x="846" y="454" width="210" height="40" rx="8" fill="#DBEAFE" stroke="#3B82F6"/>
    <text x="951" y="472" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#1E3A8A">
      Backtest KPIs &amp; Equity
    </text>
    <text x="951" y="488" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#1D4ED8">
      Win Rate • Profit Factor • PnL
    </text>
  </g>
</svg>
